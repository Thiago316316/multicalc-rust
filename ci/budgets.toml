# Size and stack budgets, keyed by <binary>.<target>.
#
# Sections are [<binary>.<target>], where <binary> is the cargo package name of a
# smoke crate (embedded-smoke today; per-domain smoke binaries to come later
# each its own section) and <target> is one of the four bare-metal triples below.
# Splitting budgets per binary keeps the gate fair: a heavy new domain grows its own
# binary's budget and never spends another domain's headroom.
#
#   text_bytes            .text size of the release smoke binary.
#   rodata_bytes          .rodata size of the same binary — read-only data, not code. A large
#                         golden (a model, a policy's weights) lands here and leaves .text almost
#                         untouched, so a .text budget on its own would not see it arrive.
#   stack_bytes_<scalar>  peak stack for that scalar type, matched to a
#                         STACK_HWM_BYTES_<SCALAR>=<n> line in the run output. The bare
#                         STACK_HWM_BYTES=<n> line counts as the f64 measurement.
#
# An absent or 0 budget is REPORT-ONLY (measured and printed, never gated).
# tolerance_pct applies to every gated row. Raising a budget is a reviewed re-baseline
# in the same PR — see ci/README.md. Never raise tolerance_pct to dodge a regression.
#
# Re-baselined when the smoke set gained the geometric-Jacobian check. Both gates moved
# on the three full-set targets: .text by 5-7% and stack from ~2.7 KB to ~3.3-3.6 KB, all
# of it the Jacobian and the forward pass it builds on. The inverse-kinematics check that
# first shipped alongside it was dropped: its solver iteration holds two 6x6 decompositions
# at once, which pushed peak stack past 7 KB and left riscv32 — the tightest of the four
# targets — without enough free stack to paint a window that deep. The thumbv6m canary runs
# --no-default-features and does not build the Jacobian check, so its numbers are unchanged
# (its .text drop is unrelated drift).
#
# Re-baselined when the smoke set gained the Franka forward-kinematics check and the model it is
# built from. The .text growth is the checked-in nine-joint model; the stack figure is unchanged in
# character, since one forward sweep over nine frames in single precision is smaller than the
# inverse-kinematics check that already sets the peak. The thumbv6m canary builds
# --no-default-features and does not compile the Franka check, so its numbers are unchanged.
#
# Re-baselined when the smoke set gained the learned-policy check. The growth is almost all
# .rodata: the policy's 5,892 f32 parameters are 23 KB of read-only data, and with the eight
# observations and their goldens the section grows by ~24.6 KB on each of the three full-set
# targets. .text moves 2-3% — the forward pass monomorphized for f32, and nothing else. This is
# what prompted gating .rodata at all: measured against .text alone, the largest thing the check
# adds to the image was invisible. The thumbv6m canary builds --no-default-features and does not
# compile the policy check, so both its numbers are unchanged to the byte, which is the intended
# result: the M0 pays nothing for a check it does not run.
#
# The .text figures are the previous baselines plus the growth measured locally, so they stay
# calibrated to whatever toolchain set them. The .rodata figures have no such history and are
# first measurements taken locally on rustc 1.97.0; if CI's differ by more than tolerance_pct,
# the failing run prints the number to re-baseline from.
#
# Run the gate for one (binary, target):
#   cargo run -p <binary> --release --target <triple> | tee smoke-<binary>-<triple>.txt
#   bash ci/check_budgets.sh <binary> <triple> smoke-<binary>-<triple>.txt
#
# Read just the raw .text size:
#   cargo size --release -p <binary> --target <triple> -- -A

tolerance_pct = 10

[embedded-smoke.thumbv7em-none-eabi]
text_bytes = 171344
rodata_bytes = 65408
stack_bytes_f64 = 3311

[embedded-smoke.thumbv7em-none-eabihf]
text_bytes = 185404
rodata_bytes = 65472
stack_bytes_f64 = 3631

[embedded-smoke.thumbv6m-none-eabi]
text_bytes = 43536
rodata_bytes = 6424
stack_bytes_f64 = 908

[embedded-smoke.riscv32imc-unknown-none-elf]
text_bytes = 200316
rodata_bytes = 66112
stack_bytes_f64 = 3291
